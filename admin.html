<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel de la carta</title>
<!-- PANEL OLA DIGITAL. Solo cambia CFG (url y clave de Supabase). Súbelo junto a la carta, p. ej. como /admin -->
<style>
:root{--p:#0B3C49;--a:#FF7A59;--bg:#F5F7FA;--t:#1c2730;--s:#5b6a74;--l:#dde3e8;--ok:#1a7f4b}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}
.w{max-width:720px;margin:0 auto;padding:0 16px}
header{background:var(--p);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px}
header .w{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:18px}
header a,header button{color:#fff;background:none;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 14px;font:600 14px inherit;text-decoration:none;cursor:pointer}
h2{font-size:20px;margin:26px 0 10px;color:var(--p)}
.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:16px;margin-bottom:14px}
input[type=text],input[type=password],input[type=email],input:not([type]),select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--l);border-radius:10px;background:#fff;color:var(--t)}
input:focus,select:focus{border-color:var(--p);outline:0}
label{display:block;font-size:13.5px;color:var(--s);margin-top:10px}
.r1{display:flex;gap:8px;align-items:center}.r1 .pre{width:92px;flex:none;text-align:right}
.pl{border-top:1px solid var(--l);padding:14px 0}.pl:first-of-type{border-top:0}
.sw{display:flex;align-items:center;gap:6px;margin:0;flex:none;font-size:14px;color:var(--t)}
.sw input{width:22px;height:22px;accent-color:#c0392b}
details{margin-top:8px}summary{cursor:pointer;color:var(--p);font-weight:600;font-size:14.5px;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13.5px;color:var(--s);align-items:center}
.chip{border:1.5px solid var(--l);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:14px;cursor:pointer;color:var(--t)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
button.b{background:var(--p);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:600 16px inherit;cursor:pointer}
button.b.o{background:#fff;color:var(--p);border:1.5px solid var(--p)}
button.lnk{background:none;border:0;color:#b3261e;font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
.cab{display:flex;gap:8px;align-items:center}.cab input{font-weight:700;font-size:18px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--l);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));z-index:9}
.bar .w{display:flex;align-items:center;gap:12px}.bar #st{flex:1;font-size:14.5px;color:var(--s)}
.bar button:disabled{opacity:.45}
.fotoe{margin-top:12px}.ft{width:96px;height:96px;object-fit:cover;border-radius:14px;display:block;margin-bottom:8px}
.mvb{background:none;border:0;color:var(--p);font:inherit;font-size:14px;cursor:pointer;padding:6px 10px 6px 0}
input[type=file]{width:100%;font:inherit;font-size:14px;padding:8px 0}
.err{color:#b3261e;font-size:14.5px;margin-top:10px}
.login{max-width:380px;margin:12vh auto 0}.login h1{color:var(--p);margin:0 0 18px;font-size:26px}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CFG = { url: "https://buggvkuvmxfejsfkpzuw.supabase.co", key: "sb_publishable_ymzzeN53rCLy73kavlUMqw_QtxybL9a", carta: "index.html", idiomas: ["es", "en", "de"] };
const AL = [["gluten","🌾","Gluten"],["crustaceos","🦐","Crustáceos"],["huevos","🥚","Huevos"],["pescado","🐟","Pescado"],["cacahuetes","🥜","Cacahuetes"],["soja","🫘","Soja"],["lacteos","🥛","Lácteos"],["frutos_secos","🌰","Frutos de cáscara"],["apio","🥬","Apio"],["mostaza","🌭","Mostaza"],["sesamo","⚪","Sésamo"],["sulfitos","🍷","Sulfitos"],["altramuces","🌼","Altramuces"],["moluscos","🐚","Moluscos"]];
const ET = [["recomendado","★ Recomendado"],["nuevo","Novedad"],["vegetariano","Vegetariano"],["picante","Picante"]];
const OT = CFG.idiomas.slice(1);

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const H = x => Object.assign({ apikey: CFG.key, "Content-Type": "application/json" }, x || {});
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
let S = { ses: JSON.parse(ls.get("cartaSes") || "null"), rows: [], i: 0, dirty: false, msg: "", err: "" };
const D = () => S.rows[S.i].data;
const gp = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
function sp(o, p, v) { const k = p.split("."), l = k.pop(); let a = o; k.forEach((x, n) => { const nx = n + 1 < k.length ? k[n + 1] : l; if (a[x] == null) a[x] = /^\d+$/.test(nx) ? [] : {}; a = a[x]; }); a[l] = v; }

/* ---- Conexión ---- */
function guardarSesion(r) { S.ses = { at: r.access_token, rt: r.refresh_token, exp: Date.now() + r.expires_in * 1000 - 60000, uid: (r.user && r.user.id) || (S.ses && S.ses.uid) }; ls.set("cartaSes", JSON.stringify(S.ses)); }
async function auth(body, grant) { const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=${grant}`, { method: "POST", headers: H(), body: JSON.stringify(body) }); if (!r.ok) throw new Error("auth"); guardarSesion(await r.json()); }
async function token() { if (S.ses.exp < Date.now()) await auth({ refresh_token: S.ses.rt }, "refresh_token"); return S.ses.at; }
async function cargar() {
  const r = await fetch(`${CFG.url}/rest/v1/cartas?owner=eq.${S.ses.uid}&select=slug,data&order=slug`, { headers: H({ Authorization: "Bearer " + await token() }) });
  if (!r.ok) throw new Error("load"); S.rows = await r.json(); S.i = 0;
  S.rows.forEach(x => { x.data = x.data || {}; x.data.categorias = x.data.categorias || []; });
}
function limpiar(d) {
  const cl = o => { if (o && typeof o === "object") Object.keys(o).forEach(k => { if (typeof o[k] === "string" && !o[k].trim()) delete o[k]; }); return o; };
  d.categorias.forEach(c => {
    cl(c.nombre);
    c.platos = (c.platos || []).filter(p => p.nombre && p.nombre.es && p.nombre.es.trim());
    c.platos.forEach(p => { cl(p.nombre); cl(p.desc); if (p.desc && !Object.keys(p.desc).length) delete p.desc; p.precio = (p.precio || "").replace(/€/g, "").trim(); if (!p.precio) delete p.precio; if (p.precios && !p.precios.length) delete p.precios; });
  });
  d.categorias = d.categorias.filter(c => c.nombre && c.nombre.es && c.platos.length);
  if (d.destacado) { cl(d.destacado.titulo); cl(d.destacado.texto); if (!d.destacado.titulo || !d.destacado.titulo.es) d.destacado = null; }
  return d;
}
async function guardar() {
  S.msg = "Guardando…"; estado();
  const d = limpiar(structuredClone(D()));
  try {
    const r = await fetch(`${CFG.url}/rest/v1/cartas?slug=eq.${encodeURIComponent(S.rows[S.i].slug)}`, { method: "PATCH", headers: H({ Authorization: "Bearer " + await token(), Prefer: "return=representation" }), body: JSON.stringify({ data: d, updated_at: new Date().toISOString() }) });
    const j = await r.json(); if (!r.ok || !j.length) throw 0;
    S.rows[S.i].data = d; S.dirty = false; S.msg = "✓ Guardado. Ya se ve en la carta."; render();
  } catch (e) { S.msg = "No se pudo guardar. Revisa la conexión e inténtalo de nuevo."; estado(); }
}

/* ---- Fotos ---- */
function reducir(file) {
  return new Promise((ok, ko) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u);
      cv.toBlob(b => b ? ok(b) : ko(), "image/jpeg", 0.82);
    };
    img.onerror = ko; img.src = u;
  });
}
async function subirFoto(file, c, j) {
  S.msg = "Subiendo foto…"; estado();
  try {
    const blob = await reducir(file), path = `${S.rows[S.i].slug}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const r = await fetch(`${CFG.url}/storage/v1/object/platos/${path}`, { method: "POST", headers: { apikey: CFG.key, Authorization: "Bearer " + await token(), "Content-Type": "image/jpeg" }, body: blob });
    if (!r.ok) throw 0;
    sp(D(), `categorias.${c}.platos.${j}.foto`, `${CFG.url}/storage/v1/object/public/platos/${path}`);
    S.dirty = true; S.msg = ""; render();
  } catch (e) { S.msg = "No se pudo subir la foto. Prueba con otra imagen."; estado(); }
}

/* ---- Pantallas ---- */
const campo = (path, ph, ex) => `<input ${ex || ""} data-path="${path}" value="${esc(gp(D(), path))}" placeholder="${esc(ph || "")}">`;
const chip = (path, v, txt, on) => `<button type="button" class="chip${on ? " on" : ""}" data-chip="${path}" data-v="${v}">${txt}</button>`;
function plato(c, j, p) {
  const P = `categorias.${c}.platos.${j}`, has = (k, v) => (p[k] || []).includes(v);
  return `<div class="pl"><div class="r1">${campo(P + ".nombre.es", "Nombre del plato", 'aria-label="Nombre"')}${campo(P + ".precio", "0,00", 'class="pre" inputmode="decimal" aria-label="Precio en euros"')}
<label class="sw"><input type="checkbox" data-bool="${P}.agotado" ${p.agotado ? "checked" : ""}>Agotado</label></div>
<details><summary>Más opciones</summary>
<label>Descripción${campo(P + ".desc.es", "Ej.: con ajo y perejil")}</label>
<label>Varios precios (ej.: Tapa:3,50; Ración:9,00)<input data-kind="precios" data-path="${P}.precios" value="${esc((p.precios || []).map(x => x.join(":")).join("; "))}"></label>
<div class="fotoe">${p.foto ? `<img class="ft" src="${esc(p.foto)}" alt="">` : ""}<label style="margin-top:0">Foto del plato (opcional)<input type="file" accept="image/*" data-foto="${c}.${j}"></label>${p.foto ? `<button class="lnk" data-a="delf" data-c="${c}" data-j="${j}">Quitar foto</button>` : ""}</div>
<div class="chips">Etiquetas: ${ET.map(e => chip(P + ".etiquetas", e[0], e[1], has("etiquetas", e[0]))).join("")}</div>
<div class="chips">Alérgenos: ${AL.map(a => chip(P + ".alergenos", a[0], a[1] + " " + a[2], has("alergenos", a[0]))).join("")}</div>
${OT.map(l => `<label>Nombre (${l})${campo(P + ".nombre." + l)}</label><label>Descripción (${l})${campo(P + ".desc." + l)}</label>`).join("")}
</details><button class="mvb" data-a="pu" data-c="${c}" data-j="${j}">↑ Subir</button><button class="mvb" data-a="pd" data-c="${c}" data-j="${j}">↓ Bajar</button><button class="lnk" data-a="delp" data-c="${c}" data-j="${j}">Eliminar plato</button></div>`;
}
function render() {
  const app = $("#app");
  if (!S.ses) {
    app.innerHTML = `<div class="login w"><h1>Panel de la carta</h1><form id="f"><label>Correo<input type="email" id="em" autocomplete="username" required></label><label>Contraseña<input type="password" id="pw" autocomplete="current-password" required></label><p class="err" id="er">${esc(S.err)}</p><button class="b" style="width:100%;margin-top:12px">Entrar</button></form></div>`;
    $("#f").onsubmit = async e => { e.preventDefault(); S.err = ""; try { await auth({ email: $("#em").value.trim(), password: $("#pw").value }, "password"); await cargar(); render(); } catch (x) { S.ses = null; $("#er").textContent = "Correo o contraseña incorrectos."; } };
    return;
  }
  if (!S.rows.length) { app.innerHTML = `<header><div class="w"><b>Panel de la carta</b><button data-a="out">Salir</button></div></header><div class="w"><h2>No hay ninguna carta asociada a tu cuenta</h2><p>Avisa a Ola Digital para que la active.</p></div>`; return; }
  const d = D(), r = S.rows[S.i];
  app.innerHTML = `<header><div class="w"><b>${esc(r.slug)}</b><span><a href="${esc(CFG.carta)}?bar=${encodeURIComponent(r.slug)}" target="_blank" rel="noopener">Ver mi carta</a> <button data-a="pass">Contraseña</button> <button data-a="out">Salir</button></span></div></header>
<div class="w">${S.rows.length > 1 ? `<label>Carta<select data-a="sel">${S.rows.map((x, k) => `<option value="${k}" ${k === S.i ? "selected" : ""}>${esc(x.slug)}</option>`).join("")}</select></label>` : ""}
<h2>Pizarra del día</h2><div class="card"><label style="margin-top:0">Título (déjalo vacío para ocultarla)${campo("destacado.titulo.es", "Ej.: Hoy en pizarra")}</label><label>Texto${campo("destacado.texto.es", "Ej.: Urta a la roteña, hasta fin de existencias")}</label>
<details><summary>Traducciones</summary>${OT.map(l => `<label>Título (${l})${campo("destacado.titulo." + l)}</label><label>Texto (${l})${campo("destacado.texto." + l)}</label>`).join("")}</details></div>
${d.categorias.map((c, i) => `<h2>${esc((c.nombre && c.nombre.es) || "Nueva categoría")}</h2><div class="card"><div class="cab">${campo(`categorias.${i}.nombre.es`, "Nombre de la categoría")}</div>
<details><summary>Traducciones de la categoría</summary>${OT.map(l => `<label>Nombre (${l})${campo(`categorias.${i}.nombre.${l}`)}</label>`).join("")}</details>
${(c.platos || []).map((p, j) => plato(i, j, p)).join("")}
<button class="b o" data-a="addp" data-c="${i}">+ Añadir plato</button> <button class="mvb" data-a="cu" data-c="${i}">↑ Subir categoría</button><button class="mvb" data-a="cd" data-c="${i}">↓ Bajar categoría</button><button class="lnk" data-a="delc" data-c="${i}">Eliminar categoría</button></div>`).join("")}
<button class="b o" data-a="addc">+ Añadir categoría</button></div>
<div class="bar"><div class="w"><span id="st"></span><button class="b" id="sv" data-a="save">Guardar cambios</button></div></div>`;
  estado();
}
function estado() { const st = $("#st"); if (!st) return; st.textContent = S.dirty ? "Tienes cambios sin guardar" : S.msg; $("#sv").disabled = !S.dirty; }

/* ---- Eventos ---- */
const app = $("#app");
app.addEventListener("input", e => {
  const t = e.target, p = t.dataset.path; if (!p) return;
  if (t.dataset.kind === "precios") { const a = t.value.split(";").map(x => x.split(":")).filter(x => x[0].trim() && x[1] && x[1].trim()).map(x => [x[0].trim(), x[1].trim()]); sp(D(), p, a); }
  else sp(D(), p, p.endsWith(".precio") ? t.value.replace(/€/g, "") : t.value);
  S.dirty = true; S.msg = ""; estado();
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.foto) { const q = t.dataset.foto.split("."); if (t.files[0]) subirFoto(t.files[0], +q[0], +q[1]); return; }
  if (t.dataset.bool) { sp(D(), t.dataset.bool, t.checked); S.dirty = true; estado(); }
  if (t.dataset.a === "sel") { if (S.dirty && !confirm("Hay cambios sin guardar. ¿Cambiar de carta?")) { t.value = S.i; return; } S.i = +t.value; S.dirty = false; render(); }
});
app.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.chip) { const p = t.dataset.chip; let a = gp(D(), p) || []; a = a.includes(t.dataset.v) ? a.filter(x => x !== t.dataset.v) : a.concat(t.dataset.v); sp(D(), p, a); t.classList.toggle("on"); S.dirty = true; estado(); return; }
  const a = t.dataset.a, c = +t.dataset.c, j = +t.dataset.j, d = S.rows.length ? D() : null;
  if (a === "save") guardar();
  else if (a === "addc") { d.categorias.push({ nombre: { es: "" }, platos: [{ nombre: { es: "" } }] }); S.dirty = true; render(); }
  else if (a === "addp") { d.categorias[c].platos.push({ nombre: { es: "" } }); S.dirty = true; render(); }
  else if (a === "delf") { delete d.categorias[c].platos[j].foto; S.dirty = true; render(); }
  else if (a === "pu" || a === "pd") { const L = d.categorias[c].platos, k = a === "pu" ? j - 1 : j + 1; if (k >= 0 && k < L.length) { [L[j], L[k]] = [L[k], L[j]]; S.dirty = true; render(); } }
  else if (a === "cu" || a === "cd") { const L = d.categorias, k = a === "cu" ? c - 1 : c + 1; if (k >= 0 && k < L.length) { [L[c], L[k]] = [L[k], L[c]]; S.dirty = true; render(); } }
  else if (a === "delp") { if (confirm("¿Eliminar este plato?")) { d.categorias[c].platos.splice(j, 1); S.dirty = true; render(); } }
  else if (a === "delc") { if (confirm("¿Eliminar la categoría y todos sus platos?")) { d.categorias.splice(c, 1); S.dirty = true; render(); } }
  else if (a === "out") { if (!S.dirty || confirm("Hay cambios sin guardar. ¿Salir?")) { ls.set("cartaSes", null); S.ses = null; S.rows = []; S.dirty = false; render(); } }
  else if (a === "pass") {
    const n = prompt("Nueva contraseña (mínimo 8 caracteres):"); if (!n) return;
    if (n.length < 8) return alert("Demasiado corta.");
    try { const r = await fetch(`${CFG.url}/auth/v1/user`, { method: "PUT", headers: H({ Authorization: "Bearer " + await token() }), body: JSON.stringify({ password: n }) }); alert(r.ok ? "Contraseña cambiada." : "No se pudo cambiar la contraseña."); } catch (x) { alert("No se pudo cambiar la contraseña."); }
  }
});
window.addEventListener("beforeunload", e => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
(async () => { if (S.ses) { try { await cargar(); } catch (e) { S.ses = null; ls.set("cartaSes", null); } } render(); })();
</script>
</body>
</html>
